[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

lib_compat_mode = off
lib_ldf_mode = chain
lib_archive = no

lib_deps =
    https://github.com/BOJIT/PlatformIO-FreeRTOS.git

# Force our Wokwi-safe portmacro.h to be processed first in every file
# (the library's own ARM_CM3 folder outranks include/ in the search order).
build_flags =
    -include include/portmacro.h
    -Wl,-u,_printf_float

# Removes the stock ARM_CM3 port.c / portmacro.h from the build.
extra_scripts = pre:remove_stock_port.py
check_flags = cppcheck: --suppress=unusedFunction

; --- Wokwi debugging (optional) ---
debug_tool = custom
debug_port = localhost:3333
debug_server =

[env:native]
platform = native
test_framework = unity
test_build_src = yes
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_toolchain.py
check_flags = cppcheck: --suppress=unusedFunction
build_src_filter = +<alarm_logic.cpp> +<dht22_logic.cpp> +<input_logic.cpp> +<sensors_logic.cpp> +<system_state_logic.cpp>
check_src_filters = +<src/*_logic.cpp>